name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Whether a pull request touches anything but lessons. `build` is the check
  # main requires, so it cannot be path-filtered away: a required check that
  # never reports leaves the pull request unmergeable. Instead the job always
  # runs and reports, and skips everything but the formatter when the diff is
  # confined to docs/lessons/**. A second workflow reporting its own `build`
  # for docs paths would have been the other way to do it, and was not taken:
  # two check runs sharing a name resolve to whichever finished last, and a
  # pull request touching both a lesson and the solver could have had the
  # trivial one stand for the real one.
  #
  # On a push to main nothing is skipped; the fast path is for pull requests.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull_request checkout is the merge commit, whose first parent is
          # the base branch; two commits are enough to diff the whole change.
          fetch-depth: 2

      - name: Is the change lessons only?
        id: diff
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '^docs/lessons/'; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        # The visual job below is the only one that needs a browser, and
        # downloading Chrome on every job would cost this one a minute for
        # nothing.
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # First because it is the cheapest and the least interesting: prettier
      # owns formatting here, and a diff that argues with it is noise in every
      # review after it. CLAUDE.md said this ran in CI before it did, and the
      # export list in src/ui/tokens.ts went eight characters over and reached
      # a pull request unnoticed. #111
      - name: Format
        run: npm run format:check

      # Before the tests: no-undef finds in a second what the suite can only
      # find if its grid happens to reach the branch. esbuild resolves no
      # cross-scope names, so the build is no help at all here.
      - name: Lint
        if: needs.changes.outputs.docs-only != 'true'
        run: npm run lint

      # And the same argument, one step further: a file that has been converted
      # to TypeScript is not linted at all — eslint here has no TS parser — so
      # this is what stands in `no-undef`'s place for it, and finds a good deal
      # more besides. Neither the build nor the suite can see any of it: vite
      # and vitest both strip types with esbuild and never check them. #11
      - name: Typecheck
        if: needs.changes.outputs.docs-only != 'true'
        run: npm run typecheck

      # Runs before the build: a moved design, a blank render or a part drawn
      # outside the shape the solver sized it at is the failure worth seeing
      # first, and the build passing says nothing about any of them.
      - name: Design snapshot, render sweep, model checks and mission sweep
        if: needs.changes.outputs.docs-only != 'true'
        run: npm test

      - name: Build
        if: needs.changes.outputs.docs-only != 'true'
        run: npm run build

  # Separate from `build` on purpose. The main suite is already a couple of
  # minutes and test/model.test.js carries a note about a worker running out of
  # memory when the mission models were built twice; a browser in that run
  # invites it back. three.js splits its own screenshot tests out for the same
  # reason. #73
  visual:
    name: Visual
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Chrome is downloaded here and nowhere else. The runner is amd64, where
      # Chrome for Testing does publish a build, so puppeteer's own is fine and
      # the apt chromium the dev container needs is not.
      - name: Cache the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # What jsdom cannot see: whether a shader compiles, whether anything is
      # drawn, whether the canvas is the size of its panel, whether the drawing
      # survives a repaint, and whether the plan redraws when a stage is
      # dropped. Every one of those shipped past a green build at least once.
      # And what no assertion can: the layout suite writes a full-page
      # screenshot of each screen beside the numbers it measured, for a
      # person to look at. Never compared. #129
      - name: Render the build view in a real browser
        run: npm run test:visual

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layout
          path: visual/.out
          # A dot-directory, like perf/.out; the action skips hidden paths
          # unless told otherwise and reports "no files found".
          include-hidden-files: true
          if-no-files-found: error
