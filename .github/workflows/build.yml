name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the build: a moved design, a blank render or a part drawn
      # outside its panel is the failure worth seeing first, and the build
      # passing says nothing about any of them.
      - name: Design snapshot, render sweep and panel containment
        run: npm test

      - name: Build
        run: npm run build
